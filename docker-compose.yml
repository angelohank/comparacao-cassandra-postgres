version: "3.9"

services:
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: medicoesCluster
      CASSANDRA_START_RPC: "true"
      CASSANDRA_NUM_TOKENS: 8
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - cassandra_net

  cassandra2:
    image: cassandra:4.1
    container_name: cassandra2
    environment:
      - CASSANDRA_CLUSTER_NAME=medicoesCluster
      - CASSANDRA_DC=dc1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_SEEDS=cassandra
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_BROADCAST_ADDRESS=cassandra2
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
    depends_on:
      - cassandra
    volumes:
      - cassandra2_data:/var/lib/cassandra
    networks:
      - cassandra_net

  cassandra3:
    image: cassandra:4.1
    container_name: cassandra3
    environment:
      - CASSANDRA_CLUSTER_NAME=medicoesCluster
      - CASSANDRA_DC=dc1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_SEEDS=cassandra
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_BROADCAST_ADDRESS=cassandra3
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
    depends_on:
      - cassandra
    volumes:
      - cassandra3_data:/var/lib/cassandra
    networks:
      - cassandra_net

volumes:
  cassandra_data:
  cassandra2_data:
  cassandra3_data:

networks:
  cassandra_net:
    driver: bridge
